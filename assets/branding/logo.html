<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MeetSync logo</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: 'Google Sans', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .root {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 20px 24px;
    background: #ffffff;
  }
  .mark {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: linear-gradient(135deg, #1a73e8 0%, #4285f4 60%, #34a853 140%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(26, 115, 232, 0.25);
  }
  .wordmark {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .name {
    font-size: 22px;
    font-weight: 600;
    color: #202124;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 11px;
    color: #5f6368;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-top: 3px;
  }
</style>
</head>
<body>
  <div class="root">
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white">
        <path d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z"/>
      </svg>
    </div>
    <div class="wordmark">
      <span class="name">MeetSync</span>
      <span class="subtitle">for NotebookLM</span>
    </div>
  </div>
</body>
</html>
