<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MeetSync icon</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; width: 100%; height: 100%; }
  .icon {
    width: 100vw;
    height: 100vh;
    /* corner radius proportional to size: ~22% gives the squircle feel */
    border-radius: 22%;
    background: linear-gradient(135deg, #1a73e8 0%, #4285f4 60%, #34a853 140%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg {
    width: 62%;
    height: 62%;
  }
</style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
      <path d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z"/>
    </svg>
  </div>
</body>
</html>
